<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#070b14" />
  <title>Voltlink</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M13 2 4.5 14H11l-1 8 8.5-12H12z' fill='%23ffd93b' stroke='%23ffd93b' stroke-width='1' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <!-- CrazyGames SDK v3 (only activates on crazygames.com) -->
  <script>
    /* CrazyGames SDK: se carga SOLO en el portal (y en localhost para pruebas).
       En glitchrushgg.com no se contacta ningun tercero (GDPR). js/sdk.js degrada
       con gracia cuando window.CrazyGames no existe. */
    if (/(^|\.)crazygames\.|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) {
      document.write('<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"><\/script>');
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- ===== HUD ===== -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-score">
        <div id="score">0</div>
        <div class="hud-sub"><span id="modeTag">ENDLESS</span> · BEST <span id="best">0</span></div>
      </div>
    </div>
    <div id="streakBadge" class="hidden">🔥 STREAK 2</div>
    <div id="surgeBar"><div id="surgeFill"></div><span id="surgeLabel">SURGE</span></div>
    <div class="hud-bottom">
      <button id="btnHammer" class="tool-btn">🔨 <b>×1</b><small>break a node</small></button>
      <button id="btnUndo" class="tool-btn">↩ <b>×2</b><small>undo · ad</small></button>
      <button id="btnSound" class="mini-btn">🔊</button>
    </div>
  </div>

  <!-- ===== TITLE ===== -->
  <div id="title" class="overlay">
    <h1 class="logo">VOLT<span>LINK</span></h1>
    <p class="tagline">Drag chains of equal-or-double numbers</p>
    <p class="tagline accent">6+ links forge a ⚡ VOLT ORB · fill the SURGE</p>
    <div class="menu-best">BEST <b id="titleBest">0</b></div>
    <div class="title-btns">
      <button id="btnEndless" class="big-btn go">ENDLESS<small>classic score chase</small></button>
      <button id="btnDaily" class="big-btn daily">⚡ DAILY CIRCUIT<small>CIRCUIT #1 · not played</small></button>
    </div>
    <button id="btnShare" class="mini-btn">SHARE</button>
  </div>

  <!-- ===== GAME OVER ===== -->
  <div id="over" class="overlay hidden">
    <div class="panel over-panel">
      <div id="overMode" class="over-mode">ENDLESS</div>
      <div id="overNewBest" class="new-best hidden">★ NEW BEST ★</div>
      <div class="over-label">SCORE</div>
      <div id="overScore" class="over-score">0</div>
      <div class="over-stats">
        <span>BEST <b id="overBest">0</b></span>
        <span>TOP TILE <b id="overTile">—</b></span>
      </div>
      <button id="btnRevive" class="big-btn ad">▶ RECHARGE<small>watch ad · clears static + lowest tier</small></button>
      <button id="btnRetry" class="big-btn go">PLAY AGAIN</button>
      <button id="btnHome" class="mini-btn wide">MENU</button>
    </div>
  </div>

  <div id="shareToast">Copied — challenge your friends!</div>

  <script src="js/sdk.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script data-honest-copy-v1>
  /* Copy honesto: fuera de CrazyGames no se reproduce ningun anuncio, asi que
     los botones "watch ad" mienten. En el sitio propio (cualquier host que no
     sea crazygames.com) se reetiquetan a "FREE"; en el portal se mantiene el
     texto porque alli si hay anuncio real. Cubre etiquetas estaticas y las que
     el juego vuelve a pintar (MutationObserver). No toca ninguna logica. */
  (function () {
    if (/(^|\.)crazygames\./.test(location.hostname)) return;
    function relabel(node) {
      if (node.nodeType === 3) {
        var v = node.nodeValue, nv = v.replace(/watch ad/gi, 'FREE');
        if (nv !== v) node.nodeValue = nv;
      } else if (node.nodeType === 1) {
        for (var i = 0; i < node.childNodes.length; i++) relabel(node.childNodes[i]);
      }
    }
    function start() {
      relabel(document.body);
      new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          var m = muts[i];
          if (m.type === 'characterData') relabel(m.target);
          else for (var j = 0; j < m.addedNodes.length; j++) relabel(m.addedNodes[j]);
        }
      }).observe(document.body, { subtree: true, childList: true, characterData: true });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
  </script>
</body>
</html>
