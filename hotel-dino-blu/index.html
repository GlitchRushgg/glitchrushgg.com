<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1773b0" />
  <meta name="description" content="Juego 3D: eres camarera de pisos en el Hotel Dino Blu de Praia a Mare. Limpia las habitaciones de tu piso antes de que acabe tu jornada." />
  <meta property="og:title" content="Hotel Dino Blu — Turno de Limpieza 3D 🧹" />
  <meta property="og:description" content="¿Podrás dejar perfectas las 12 habitaciones de tu piso antes de las 14:00? Fermata, partenza, toallas, sábanas… ¡y la gobernanta vigilando!" />
  <meta property="og:image" content="https://glitchrushgg.com/hotel-dino-blu/assets/cover.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Hotel Dino Blu — Turno de Limpieza 3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧹</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="topbar">
        <span class="chip" id="clock">🕕 6:00</span>
        <span class="chip" id="roomsDone">🛏 0/11</span>
        <span class="chip" id="score">⭐ 0</span>
        <span class="chip" id="rating">🏨 ★★★☆☆</span>
        <span class="chip" id="hearts">❤❤❤</span>
        <span class="chip" id="pace">Ritmo ✅</span>
        <button class="chip" id="btnMusic" title="Música">🔊</button>
      </div>
      <div id="combo" class="hidden">🔥 <b>x2</b><span></span></div>
      <div id="objective" class="hidden"></div>
      <div id="inv"></div>
      <div id="checklist" class="hidden"></div>
      <div id="prompt" class="hidden">
        <div id="promptText"></div>
        <div id="pbar"><div id="pfill"></div></div>
      </div>
      <div id="toast" class="hidden"></div>
    </div>

    <!-- Controles táctiles -->
    <div id="joy" class="hidden"><div id="stick"></div></div>
    <button id="btnAction" class="hidden">✋</button>

    <div id="fade"></div>
    <div id="flash"></div>

    <!-- Pantalla de inicio -->
    <div id="intro">
      <div class="panel">
        <div id="langRow"></div>
        <h1>🌊 HOTEL DINO BLU ★★★</h1>
        <!-- Los textos los rellena applyIntroTexts() (game.js) según el idioma -->
        <div id="dayBadge"></div>
        <p class="sub" id="sub"></p>
        <div id="record" class="hidden"></div>

        <!-- CTA principal: empezar ya sin tener que bajar por todo el panel -->
        <button id="btnStartTop" class="bigbtn topcta">🧹 …</button>
        <p id="tweakHint" class="tweakhint"></p>

        <div id="customize">
          <h3 id="custTitle"></h3>
          <div class="cust-inner">
            <canvas id="charPreview" width="170" height="250"></canvas>
            <div id="custRows"></div>
          </div>
        </div>

        <div id="zones"></div>
        <div id="modeRow"></div>
        <p id="story"></p>

        <details class="manual">
          <summary id="manualTitle"></summary>
          <ul id="manualList"></ul>
        </details>

        <details class="manual">
          <summary id="parteTitle"></summary>
          <div id="parte"></div>
        </details>

        <div class="controls">
          <h2 id="controlsTitle"></h2>
          <p class="desktop-help" id="deskHelp"></p>
          <p class="touch-help" id="touchHelp"></p>
        </div>

        <button id="btnStart">🧹 …</button>
        <p id="disclaimer"></p>
      </div>
    </div>

    <!-- Diálogos (toallas / ascensor) -->
    <div id="dialog" class="hidden"></div>

    <!-- Fin de jornada -->
    <div id="end" class="hidden"></div>
  </div>

  <script type="importmap">
    { "imports": { "three": "./lib/three.module.js" } }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
