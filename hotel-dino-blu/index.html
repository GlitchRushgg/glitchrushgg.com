<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script data-load-guard>
  /* Load guard: if a game file fails to arrive (e.g. a momentary 503 from the host),
     reload once by itself; if it fails again within a minute, show a retry button
     instead of a frozen screen. Third-party ad/analytics scripts are ignored. */
  (function () {
    var KEY = 'gr_load_guard:' + location.pathname, handled = false;
    function retryScreen() {
      var d = document.createElement('div');
      d.setAttribute('role', 'alert');
      d.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;' +
        'align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;' +
        'background:rgba(8,12,22,.95);color:#fff;font:600 17px/1.4 system-ui,-apple-system,sans-serif';
      d.innerHTML = '<div>The game didn’t finish loading.<br>' +
        '<span style="opacity:.7;font-size:14px">Check your connection and try again.</span></div>';
      var b = document.createElement('button');
      b.textContent = 'Tap to retry';
      b.style.cssText = 'font:700 17px system-ui,-apple-system,sans-serif;padding:13px 30px;border:0;' +
        'border-radius:14px;background:#38e8ff;color:#06121f;cursor:pointer';
      b.onclick = function () { location.reload(); };
      d.appendChild(b);
      document.body.appendChild(d);
    }
    function onFail() {
      if (handled) return;
      handled = true;
      var last = 0;
      try { last = +sessionStorage.getItem(KEY) || 0; } catch (e) {}
      if (Date.now() - last > 60000) {
        try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}
        setTimeout(function () { location.reload(); }, 700);
        return;
      }
      if (document.body) retryScreen();
      else document.addEventListener('DOMContentLoaded', retryScreen);
    }
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (!t || t === window || !t.tagName) return;
      var url = t.src || t.href || '';
      if (/crazygames|google|doubleclick|mailerlite|web3forms/i.test(url)) return;
      if (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && /stylesheet/i.test(t.rel))) onFail();
    }, true);
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1773b0" />
  <meta name="description" content="Juego 3D: eres camarera de pisos en el Hotel Dino Blu de Praia a Mare. Limpia las habitaciones de tu piso antes de que acabe tu jornada." />
  <meta property="og:title" content="Hotel Dino Blu — Turno de Limpieza 3D 🧹" />
  <meta property="og:description" content="¿Podrás dejar perfectas las 11 habitaciones de tu piso antes de las 14:00? Fermata, partenza, toallas, sábanas… ¡y la gobernanta vigilando!" />
  <meta property="og:image" content="https://glitchrushgg.com/hotel-dino-blu/assets/cover.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Hotel Dino Blu — Turno de Limpieza 3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧹</text></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="topbar">
        <span class="chip" id="clock">🕕 6:00</span>
        <span class="chip" id="roomsDone">🛏 0/11</span>
        <span class="chip" id="score">⭐ 0</span>
        <span class="chip" id="rating">🏨 ★★★☆☆</span>
        <span class="chip" id="hearts">❤❤❤</span>
        <span class="chip" id="pace">Ritmo ✅</span>
        <button class="chip" id="btnMusic" title="Música">🔊</button>
        <button class="chip" id="btnHome" title="Volver a glitchrushgg.com" style="display:none"><img src="/brand/bolt.svg" alt="Home" style="height:1.3em;vertical-align:-.25em"></button>
      </div>
      <div id="combo" class="hidden">🔥 <b>x2</b><span></span></div>
      <div id="objective" class="hidden"></div>
      <div id="inv"></div>
      <div id="checklist" class="hidden"></div>
      <div id="prompt" class="hidden">
        <div id="promptText"></div>
        <div id="pbar"><div id="pfill"></div></div>
      </div>
      <div id="toast" class="hidden"></div>
    </div>

    <!-- Controles táctiles -->
    <div id="joy" class="hidden"><div id="stick"></div></div>
    <button id="btnAction" class="hidden">✋</button>

    <div id="fade"></div>
    <div id="flash"></div>

    <!-- Pantalla de inicio -->
    <div id="intro">
      <div class="panel">
        <div id="langRow"></div>
        <h1>🌊 HOTEL DINO BLU ★★★</h1>
        <!-- Los textos los rellena applyIntroTexts() (game.js) según el idioma -->
        <div id="dayBadge"></div>
        <p class="sub" id="sub"></p>
        <div id="record" class="hidden"></div>

        <!-- CTA principal: empezar ya sin tener que bajar por todo el panel -->
        <button id="btnStartTop" class="bigbtn topcta">🧹 …</button>
        <p id="tweakHint" class="tweakhint"></p>

        <div id="customize">
          <h3 id="custTitle"></h3>
          <div class="cust-inner">
            <canvas id="charPreview" width="170" height="250"></canvas>
            <div id="custRows"></div>
          </div>
        </div>

        <div id="zones"></div>
        <div id="modeRow"></div>
        <p id="story"></p>

        <details class="manual">
          <summary id="manualTitle"></summary>
          <ul id="manualList"></ul>
        </details>

        <details class="manual">
          <summary id="parteTitle"></summary>
          <div id="parte"></div>
        </details>

        <div class="controls">
          <h2 id="controlsTitle"></h2>
          <p class="desktop-help" id="deskHelp"></p>
          <p class="touch-help" id="touchHelp"></p>
        </div>

        <button id="btnStart">🧹 …</button>
        <p id="disclaimer"></p>
      </div>
    </div>

    <!-- Diálogos (toallas / ascensor) -->
    <div id="dialog" class="hidden"></div>

    <!-- Fin de jornada -->
    <div id="end" class="hidden"></div>
  </div>

  <script type="importmap">
    { "imports": { "three": "./lib/three.module.js" } }
  </script>
  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
  <a data-privacy-link href="/privacy.html" style="position:fixed;left:6px;bottom:max(4px,env(safe-area-inset-bottom,4px));z-index:99999;font:600 10px/1 system-ui,-apple-system,sans-serif;letter-spacing:.3px;color:#9fb0c8;opacity:.5;text-decoration:none;padding:3px 7px;background:rgba(8,12,22,.4);border-radius:6px;pointer-events:auto">Privacy</a>
  <script data-privacy-link>(function(){if(location.hostname.indexOf("crazygames.")!==-1){var e=document.querySelector("a[data-privacy-link]");if(e)e.remove();}})();</script>
</body>
</html>
