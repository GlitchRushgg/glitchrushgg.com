<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#17120e" />
  <title>Merge Forge</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='8' height='8' rx='2' fill='%23c97a4a'/%3E%3Crect x='13' y='3' width='8' height='8' rx='2' fill='%23c97a4a'/%3E%3Crect x='8' y='13' width='8' height='8' rx='2' fill='%23f5c542'/%3E%3C/svg%3E" />
  <!-- CrazyGames SDK v3 (only activates on crazygames.com) -->
  <script>
    /* CrazyGames SDK: se carga SOLO en el portal (y en localhost para pruebas).
       En glitchrushgg.com no se contacta ningun tercero (GDPR). js/sdk.js degrada
       con gracia cuando window.CrazyGames no existe. */
    if (/(^|\.)crazygames\.|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) {
      document.write('<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"><\/script>');
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- ===== HUD ===== -->
  <div id="hud">
    <div class="hud-top">
      <div id="streakChip" class="chip hidden">🔥 ×2</div>
      <div class="hud-score">
        <div id="score">0</div>
        <div id="best">BEST 0</div>
      </div>
      <div id="metalChip" class="chip">Copper</div>
    </div>
    <div class="hud-corner">
      <button id="btnShare" class="mini-btn">⤴</button>
      <button id="btnSound" class="mini-btn">🔊</button>
    </div>
    <div class="boosters">
      <button id="btnReroll" class="boost-btn">▶ REROLL<small>watch ad · fresh pieces</small></button>
      <button id="btnHammer" class="boost-btn">▶ HAMMER<small>watch ad · smash 1 cell</small></button>
    </div>
  </div>

  <!-- ===== GAME OVER ===== -->
  <div class="overlay hidden" id="overModal">
    <div class="modal">
      <div id="ovNewBest" class="new-best hidden">★ NEW BEST ★</div>
      <div class="ov-label">FORGE COOLED</div>
      <div id="ovScore" class="ov-score">0</div>
      <div class="ov-stats">
        <span>BEST <b id="ovBest">0</b></span>
        <span>FORGED <b id="ovMetal">Copper</b></span>
      </div>
      <button id="btnRevive" class="m-btn ad">▶ RELIGHT THE FORGE<small>watch ad · clears 3 bottom rows</small></button>
      <button id="btnAgain" class="m-btn go">PLAY AGAIN</button>
      <button id="btnShare2" class="m-btn">SHARE SCORE</button>
    </div>
  </div>

  <script src="js/format.js"></script>
  <script src="js/sdk.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script data-honest-copy-v1>
  /* Copy honesto: fuera de CrazyGames no se reproduce ningun anuncio, asi que
     los botones "watch ad" mienten. En el sitio propio (cualquier host que no
     sea crazygames.com) se reetiquetan a "FREE"; en el portal se mantiene el
     texto porque alli si hay anuncio real. Cubre etiquetas estaticas y las que
     el juego vuelve a pintar (MutationObserver). No toca ninguna logica. */
  (function () {
    if (/(^|\.)crazygames\./.test(location.hostname)) return;
    function relabel(node) {
      if (node.nodeType === 3) {
        var v = node.nodeValue, nv = v.replace(/watch ad/gi, 'FREE');
        if (nv !== v) node.nodeValue = nv;
      } else if (node.nodeType === 1) {
        for (var i = 0; i < node.childNodes.length; i++) relabel(node.childNodes[i]);
      }
    }
    function start() {
      relabel(document.body);
      new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          var m = muts[i];
          if (m.type === 'characterData') relabel(m.target);
          else for (var j = 0; j < m.addedNodes.length; j++) relabel(m.addedNodes[j]);
        }
      }).observe(document.body, { subtree: true, childList: true, characterData: true });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
  </script>
</body>
</html>
