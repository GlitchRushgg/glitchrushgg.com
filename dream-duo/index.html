<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2a1a4e" />
  <title>Dream Duo — Elizabeth &amp; Flofy</title>
  <meta name="description" content="One brain, two worlds. Elizabeth runs the park, her magic bunny Flofy hops the dream — you guide BOTH at the same time. Catch every star. Can your brain handle it?" />
  <meta property="og:title" content="Dream Duo — Elizabeth &amp; Flofy" />
  <meta property="og:description" content="One brain, two worlds — at the same time. Catch every star. Can your brain handle it?" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='8' cy='14' r='6' fill='%23ff9ed2'/%3E%3Ccircle cx='16' cy='8' r='6' fill='%23b9a6ff'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; padding: 0; background: #14102b; height: 100%; overflow: hidden; }
    /* pillarbox de escritorio: el sueño desenfocado detrás del canvas portrait */
    body::before { content: ""; position: fixed; inset: -40px; z-index: 0;
      background: url("assets/art/bg-col-dream.jpg") center / cover no-repeat;
      filter: blur(26px) brightness(0.55); }
    #game { position: relative; z-index: 1; width: 100vw; height: 100vh; }
  </style>
  <!-- CrazyGames SDK v3: only loaded on the platform (and localhost for testing).
       On glitchrushgg.com no third party is contacted (GDPR); src/utils/SDK.js
       degrades gracefully when window.CrazyGames is absent. -->
  <script>
    if (/(^|\.)crazygames\.|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) {
      var s = document.createElement("script");
      s.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js";
      document.head.appendChild(s);
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
